<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATM 신입 직원 교육 시스템</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #1e293b;
      --card-border: #334155;
      --accent-blue: #38bdf8;
      --accent-green: #4ade80;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }

    .container {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 1.5rem;
      padding: 2.5rem;
      max-width: 860px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    /* 헤더 영역: ATM 로고 및 접속 일자 */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 1.25rem;
      margin-bottom: 2.5rem;
    }

    .brand {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      color: var(--accent-blue);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .date-badge {
      background: #0f172a;
      border: 1px solid #475569;
      padding: 0.5rem 1.1rem;
      border-radius: 0.6rem;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--accent-green);
      letter-spacing: 0.02em;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
    }

    /* 인사말 및 메인 타이틀 */
    .greeting-section {
      text-align: center;
      margin-bottom: 3.5rem;
    }

    .welcome-text {
      font-size: 1.25rem;
      color: var(--text-sub);
      margin-bottom: 0.75rem;
      font-weight: 400;
    }

    .main-title {
      font-size: 2.25rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.02em;
      line-height: 1.3;
    }

    /* 4대 모듈 원형 링크 그리드 */
    .modules-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.5rem;
      justify-items: center;
      align-items: start;
    }

    .module-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: inherit;
      width: 100%;
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .module-item:hover {
      transform: translateY(-6px);
    }

    /* 원형 버튼 디자인 */
    .circle-btn {
      width: 115px;
      height: 115px;
      border-radius: 50%;
      background: #0f172a;
      border: 2px solid var(--accent-blue);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.15);
      transition: all 0.25s ease;
      cursor: pointer;
      position: relative;
    }

    .module-item:hover .circle-btn {
      background: var(--accent-blue);
      border-color: var(--accent-blue);
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.55);
    }

    .btn-icon {
      font-size: 1.8rem;
      margin-bottom: 0.25rem;
      color: var(--accent-blue);
      transition: color 0.25s ease;
    }

    .btn-code {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-main);
      transition: color 0.25s ease;
      letter-spacing: 0.03em;
    }

    .module-item:hover .btn-icon,
    .module-item:hover .btn-code {
      color: #0f172a;
    }

    /* 버튼 하단 텍스트 */
    .module-title {
      margin-top: 1rem;
      font-size: 1.05rem;
      font-weight: 700;
      text-align: center;
      color: #ffffff;
    }

    .module-desc {
      font-size: 0.8rem;
      color: var(--text-sub);
      text-align: center;
      margin-top: 0.35rem;
      line-height: 1.4;
    }

    /* 준비 중 (Disabled) 스타일 */
    .module-item.disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .module-item.disabled:hover {
      transform: none;
    }

    .module-item.disabled .circle-btn {
      border-color: #475569;
      box-shadow: none;
      background: #0f172a;
    }

    .module-item.disabled .btn-icon,
    .module-item.disabled .btn-code {
      color: #64748b;
    }

    /* 모바일 반응형 (가로 폭 640px 이하일 때 2x2 그리드 배치) */
    @media (max-width: 640px) {
      .container {
        padding: 1.5rem;
        border-radius: 1.2rem;
      }

      .header {
        margin-bottom: 1.75rem;
      }

      .brand {
        font-size: 1.75rem;
      }

      .date-badge {
        font-size: 0.85rem;
        padding: 0.4rem 0.8rem;
      }

      .greeting-section {
        margin-bottom: 2.25rem;
      }

      .welcome-text {
        font-size: 1.1rem;
      }

      .main-title {
        font-size: 1.65rem;
      }

      .modules-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 1.25rem;
      }

      .circle-btn {
        width: 100px;
        height: 100px;
      }

      .btn-icon {
        font-size: 1.6rem;
      }

      .btn-code {
        font-size: 0.8rem;
      }

      .module-title {
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>

  <main class="container">
    <!-- 1. 헤더: ATM 로고 및 접속 일자 -->
    <header class="header">
      <div class="brand">ATM</div>
      <div class="date-badge" id="currentDate">접속일자 로딩 중...</div>
    </header>

    <!-- 2. 중앙 타이틀 -->
    <section class="greeting-section">
      <p class="welcome-text">어서 오세요.</p>
      <h1 class="main-title">“ATM 신입 직원 교육 시스템”</h1>
    </section>

    <!-- 3. 원형 링크 모듈 (단일 저장소 간편 상대경로) -->
    <nav class="modules-grid">
      <!-- ① UF6 PC 시뮬레이터 -->
      <a href="uf6_pc.html" class="module-item">
        <div class="circle-btn">
          <span class="btn-icon">🖥️</span>
          <span class="btn-code">uf6_pc</span>
        </div>
        <div class="module-title">UF6 3D (PC)</div>
        <div class="module-desc">데스크톱 정밀 시뮬레이터</div>
      </a>

      <!-- ② UF6 모바일 시뮬레이터 -->
      <a href="uf6_mo.html" class="module-item">
        <div class="circle-btn">
          <span class="btn-icon">📱</span>
          <span class="btn-code">uf6_mo</span>
        </div>
        <div class="module-title">UF6 3D (Mobile)</div>
        <div class="module-desc">현장 터치 최적화 뷰어</div>
      </a>

      <!-- ③ FOV 모듈 -->
      <a href="fov_mo.html" class="module-item">
        <div class="circle-btn">
          <span class="btn-icon">📐</span>
          <span class="btn-code">fov</span>
        </div>
        <div class="module-title">FOV-WD 교육</div>
        <div class="module-desc">화각 및 작업거리 계산</div>
      </a>

      <!-- ④ 추후 추가 예정 모듈 -->
      <div class="module-item disabled" title="준비 중인 모듈입니다">
        <div class="circle-btn">
          <span class="btn-icon">➕</span>
          <span class="btn-code">추후 추가</span>
        </div>
        <div class="module-title">준비 중</div>
        <div class="module-desc">신규 모듈 예정</div>
      </div>
    </nav>
  </main>

  <script>
    // 한국 표준시 접속 일자 자동 계산 및 표기 (YYYY. MM. DD 형식)
    function updateAccessDate() {
      const dateElement = document.getElementById('currentDate');
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      
      const weekdays = ['일', '월', '화', '수', '목', '금', '토'];
      const weekday = weekdays[now.getDay()];

      dateElement.textContent = `접속 일자 : ${year}. ${month}. ${day} (${weekday})`;
    }

    updateAccessDate();
  </script>
</body>
</html>
